    <!--
      Eskirgan bundle — KO'RINMAS tiklanish.

      Brauzerda eski index.html qolgan bo'lsa (deploy dan keyin asset
      hash lari o'zgaradi), u endi mavjud bo'lmagan faylni so'raydi va
      React umuman ishga tushmaydi — oq ekran.

      Bu yerda foydalanuvchiga HECH NARSA ko'rsatilmaydi: na xabar, na
      tugma. Taymer ham yo'q (u sog'lom, sekin yuklanayotgan saytni
      "buzilgan" deb yanglishardi). Faqat HAQIQIY yuklanish xatosida
      sahifa bir marta jimgina qayta yuklanadi.
    -->
    <!--
      Dark mode klassini React chizilishidan OLDIN qo'yamiz.
      Aks holda dark rejimdagi foydalanuvchi bir lahza OQ sahifani ko'radi
      ("flash of light theme") — bu ayniqsa kechqurun ko'zni qamashtiradi.
    -->
    <script data-cfasync="false">
      (function () {
        try {
          if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* private rejim */ }
      })();
    </script>

    <!--
      Telegram Mini App — SDK ni ENG ERTA yuklaymiz.

      MUAMMO (foydalanuvchi shikoyati: "Telegramda sayt birdan ishlamaydi,
      refresh qilsa ishlaydi"):
        SDK ilgari `main.tsx` dan, ya'ni ~310 KB asosiy bundle yuklanib,
        tahlil qilingandan KEYIN so'ralardi. Telegram mobil ilovada Mini App
        avval YARIM BALANDLIKDAGI panelda ochiladi va faqat `expand()`
        chaqirilgach to'liq ekranga yoyiladi. Sekin mobil internetda bu
        zanjir bir necha soniya davom etardi: shu vaqt ichida sayt yarim
        panelda, kesilgan holda turardi — foydalanuvchi buni "ishlamayapti"
        deb qabul qiladi. Qayta ochilganda SDK keshdan kelib, `expand()`
        deyarli darhol ishlagani uchun "refresh qilsa ishlaydi" bo'lardi.

      YECHIM: skript shu yerda, bundle yuklanishi bilan PARALLEL ravishda
      so'raladi va `ready()` + `expand()` imkon boricha erta chaqiriladi.
      Qolgan sozlamalar (desktopda fullscreen, vertikal swipe) `main.tsx`
      dagi `initTelegramWebApp()` da davom etadi — u SDK allaqachon
      yuklanganini ko'rib, qayta so'ramaydi.

      Telegram'dan TASHQARIDA hech qanday so'rov yuborilmaydi: shart
      bajarilmasa funksiya darhol qaytadi.
    -->
    <script data-cfasync="false">
      (function () {
        try {
          var inTelegram =
            !!(window.Telegram && window.Telegram.WebApp) ||
            !!window.TelegramWebviewProxy ||
            /[?&#]tgWebApp(Data|Platform|Version)=/.test(window.location.href);

          /**
           * Natijani SHU YERDA saqlaymiz — bu URL hali butun bo'lgan yagona
           * ishonchli payt. React Router birinchi navigatsiyada
           * `#tgWebAppData=...` fragmentini yo'qotadi, shundan keyin
           * aniqlashning iloji bo'lmay qolishi mumkin (ayniqsa iOS'da).
           */
          window.__inTelegram = inTelegram;

          if (!inTelegram) return;

          /**
           * Telegram'da `BottomNav` umuman chizilmaydi (Telegram o'z pastki
           * interfeysini ko'rsatadi), LEKIN `.has-bottom-nav` klassi u uchun
           * joy ajratishda davom etardi — har sahifa pastida 56px bo'sh
           * chiziq qolardi. Klass `<html>` ga qo'yiladi, CSS esa joyni
           * bekor qiladi (index.css). React holati orqali emas — ortiqcha
           * qayta render ham, maket sakrashi ham bo'lmaydi.
           */
          document.documentElement.classList.add('tg-app');

          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          s.async = true;
          s.onload = function () {
            var wa = window.Telegram && window.Telegram.WebApp;
            if (!wa) return;
            // Telegram'ga "tayyor" signali — yuklanish ekrani yopiladi.
            try { wa.ready(); } catch (e) { /* eski mijoz */ }
            // Yarim paneldan to'liq balandlikka. Desktopda ta'sirsiz.
            try { wa.expand(); } catch (e) { /* eski mijoz */ }
          };
          // Xato bo'lsa jimgina o'tamiz — sayt Telegram'siz ham ishlaydi.
          s.onerror = function () { /* ignore */ };
          document.head.appendChild(s);
        } catch (e) { /* ignore */ }
      })();
    </script>

    <script data-cfasync="false">
      (function () {
        var KEY = 'rl';
        var BUST = '_cb';

        // Tiklanishdan qolgan ?_cb= ni manzildan darhol olib tashlaymiz
        try {
          var u = new URL(location.href);
          if (u.searchParams.has(BUST)) {
            u.searchParams.delete(BUST);
            history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
          }
        } catch (e) { /* ignore */ }

        /**
         * Ilova ishga tushgach bu tiklanish O'CHADI (main.tsx uni yoqadi).
         *
         * NEGA: bu eshituvchi `<link rel="modulepreload">` xatolarini ham
         * ushlaydi. Ilova ishlab turganda lazy chunk yuklanmasa, u DARHOL
         * sahifani qayta yuklab, `lazyWithRetry` ning 5 urinish / ~7 soniyalik
         * byudjetini kesib tashlardi — ayni Payme'dan qaytishda mobil radio
         * uyg'onayotgan paytda eng yomon ta'sir qilardi.
         *
         * Endi vazifalar aniq bo'lingan:
         *   - ishga tushishdan OLDIN: shu skript (bitta kesh buzuvchi reload)
         *   - ishga tushgandan KEYIN: lazyWithRetry (qayta urinish + kutish)
         */
        window.__bootRecoveryArmed = true;

        window.addEventListener('error', function (ev) {
          if (!window.__bootRecoveryArmed) return;

          var el = ev && ev.target;
          if (!el) return;
          var src = el.src || el.href || '';
          if (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK') return;
          if (src.indexOf('/assets/') === -1) return;

          // Bir martadan ko'p emas — cheksiz reload sikli bo'lmasin
          try {
            if (sessionStorage.getItem(KEY) === '1') return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) { return; }

          try {
            var v = new URL(location.href);
            v.searchParams.set(BUST, Date.now().toString(36));
            location.replace(v.toString());
          } catch (e) { location.reload(); }
        }, true);
      })();
    </script>

    <!--
      Favicon — AvtoSmart brend to'plami.

      GOOGLE QIDIRUVI uchun favicon kvadrat va 48px ga karrali bo'lishi
      kerak. Bu ikki yo'l bilan ta'minlangan:
        1) `favicon.svg` — SVG uchun o'lcham sharti yo'q (Google hujjati);
        2) `favicon.ico` ichida 64x64 varianti bor (48px talabidan yuqori).

      DIQQAT — 2026-09-15 (ikki bosqichli tuzatish):
        1) ICO'dagi 48px avval nozik chiziqli ("rul" detali) dizaynda
           edi — Google уни kichraytirganda chiziqlar qo'shilib ketib
           favicon deyarli OQ ko'rinardi. 64px'ga (48 talabidan yuqori)
           "asosiy logo" (quyuq ink rangli S, aniq kontrast) qo'yildi.
        2) 16/32px'dagi eski dizaynda "S" harfi RANG bilan emas, DISK
           ICHIDA SHAFFOF TESHIK sifatida chizilgan edi (evenodd
           fill-rule) — och/oq fonda harf ko'rinmay ketardi. Endi teshik
           OPAQUE OQ rangga to'ldirilgan: shakl saqlanadi, lekin ortidagi
           fonga bog'liqlik yo'qoladi.
      `favicon.svg` endi to'liq "asosiy logo" vektori (`avtosmart-icon.svg`)
      — teshik emas, haqiqiy rangli shakllar.
      192x192 PNG `<link>` da ATAYLAB YO'Q: brauzer uni har tashrifda
      yuklab, ~25 KB behuda sarflardi. U `site.webmanifest` da qoladi —
      Android'da "ekranga qo'shish" uchun o'sha yerdan olinadi.

      `apple-touch-icon.png` endi 192x192 (avval 180x180 edi) — 2026-09-15
      dagi qalin "S" dizayniga o'tishda mos o'lcham topilmagani uchun
      mavjud 192px fayl ishlatildi. iOS buni muammosiz masshtablaydi.
      https://developers.google.com/search/docs/appearance/favicon-in-search
    -->
